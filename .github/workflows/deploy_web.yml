name: Export Web & Deploy to repo "play"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "deploy-play"
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.6.3

jobs:
  export-web:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.6.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          mkdir -vp ~/.local/share/godot/export_templates/
          if [ -d "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ]; then
            mv -v "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ~/.local/share/godot/export_templates/
          fi
          ls -la ~/.local/share/godot/export_templates/

      - name: Write build version (affichée dans le menu)
        run: |
          SHORT=$(echo "$GITHUB_SHA" | cut -c1-7)
          sed -i "s/^const VERSION := .*/const VERSION := \"$SHORT\"/" scripts/data/build_info.gd
          cat scripts/data/build_info.gd

      - name: Import assets (nouvelles images de rendus)
        run: godot --headless --import || true

      - name: Export Web (no threads, GitHub Pages compatible)
        run: |
          mkdir -vp build/web
          godot --headless --verbose --export-release "Web" "$(pwd)/build/web/index.html"
          ls -la build/web

      - name: Cache busting (nom de fichier unique à chaque version)
        # GitHub Pages laisse les navigateurs garder les fichiers en cache : on renomme
        # le pack du jeu avec le commit pour forcer le chargement de la nouvelle version.
        run: |
          SHORT=$(echo "$GITHUB_SHA" | cut -c1-7)
          mv build/web/index.pck "build/web/index.$SHORT.pck"
          sed -i "s/\"fileSizes\":{\"index.pck\"/\"mainPack\":\"index.$SHORT.pck\",\"fileSizes\":{\"index.$SHORT.pck\"/" build/web/index.html
          sed -i 's#<head>#<head>\n<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">#' build/web/index.html
          grep -q "index.$SHORT.pck" build/web/index.html || { echo "::error::mainPack non remplacé dans index.html"; exit 1; }
          grep -o 'const GODOT_CONFIG = [^;]*;' build/web/index.html
          ls -la build/web

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          if-no-files-found: error

  deploy-play:
    needs: export-web
    runs-on: ubuntu-latest
    steps:
      - name: Check that the PLAY_REPO_TOKEN secret exists
        env:
          TOKEN: ${{ secrets.PLAY_REPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret PLAY_REPO_TOKEN missing."
            exit 1
          fi

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build/web

      - name: Push build to the play repo
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PLAY_REPO_TOKEN }}
          external_repository: GuillaumeAlves/Cinqo-noches-at-Guillaumes-Alves-play
          publish_branch: main
          publish_dir: build/web
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          commit_message: "Build web depuis ${{ github.sha }}"
